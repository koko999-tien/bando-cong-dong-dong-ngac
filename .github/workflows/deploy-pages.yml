name: Deploy HUMG Community WebGIS to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static bundle (exclude node_modules & dev scripts)
        run: |
          mkdir -p _site
          cp -r index.html styles.css config.js humg-data.js gis-utils.js knowledge-engine.js app.js admin.js \
            khao-sat.html cam-nang-1-cham.html infographics-va-ban-tin.html thuyet-trinh.html du-lieu-mo.html phieu-thuc-dia.html admin.html \
            manifest.webmanifest sw.js icon.svg vendor exports _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
